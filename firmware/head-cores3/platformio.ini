[env:cores3]
platform = espressif32@6.10.0
board = m5stack-cores3
framework = arduino
lib_deps =
    m5stack/M5Unified
    m5stack/M5CoreS3
lib_extra_dirs = ../common
monitor_speed = 115200
monitor_echo = yes    ; show what you type
monitor_eol = LF      ; Enter sends a plain newline, which the console waits for
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1    ; serial over the CoreS3's own USB port