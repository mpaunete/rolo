; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
; Arduino core with Bluepad32 (gamepads) built in. Based on arduino-esp32 2.0.x / ESP-IDF 4.4
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
; Two 1.9 MB app slots: room for Bluetooth, and keeps over-the-air updates possible
board_build.partitions = min_spiffs.csv
; Web server's network task on core 0 (it defaults to any core, at a priority that
; would interrupt the control loop on core 1)
build_flags =
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
lib_deps = 
    teemuatlut/TMCStepper@^0.7.3
    adafruit/Adafruit MPU6050@^2.2.9
    ESP32Async/AsyncTCP@^3.5.0
    ESP32Async/ESPAsyncWebServer@^3.12.1
    adafruit/Adafruit NeoPixel@^1.12.3

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0