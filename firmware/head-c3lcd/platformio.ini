[env:c3lcd]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1        ; works for the ESP32-C3 SuperMini
framework = arduino
lib_deps =
    lovyan03/LovyanGFX@^1.1.16    ; the library M5GFX is built on: same canvas and DMA calls as the CoreS3 eyes
lib_extra_dirs = ../common
monitor_speed = 115200
monitor_echo = yes    ; show what you type
monitor_eol = LF      ; Enter sends a plain newline, which the console waits for
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_MODE=1           ; serial over the C3's own USB port
    -DARDUINO_USB_CDC_ON_BOOT=1
